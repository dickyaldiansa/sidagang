<VirtualHost *:80>
    ServerName sidagang.test
    ServerAlias sidagang.appcatalog.id
    DocumentRoot "D:/laragon/www/sidagang/public"

    <Directory "D:/laragon/www/sidagang/public">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog "D:/laragon/www/sidagang/storage/logs/apache-error.log"
    CustomLog "D:/laragon/www/sidagang/storage/logs/apache-access.log" combined
</VirtualHost>
